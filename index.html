<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Strategy — Already in Flight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Literata:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&family=Roboto:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="bg">
      <div class="dots"></div>
    </div>
    <div id="progress"></div>
    <div id="stage">
      <!-- SLIDE 0: TITLE -->
      <div class="slide active">
        <div class="w-full h-full flex flex-col items-center justify-center relative overflow-hidden">
          <div class="dots"></div>
          <div class="s1-content">
            <div class="mg-frame" style="display:inline-flex;align-items:center;justify-content:center;padding:2rem;">
              <img src="Assets/Manifest-Global--Horizontal-Logo-SVG.png"
                   alt="Manifest Global"
                   style="width:680px;height:auto;display:block;" />
            </div>
            <div class="s1-bottom">
              <div class="s1-date" style="font-family:'Literata',Georgia,serif;font-style:italic;letter-spacing:0.04em;text-transform:none;font-size:28px;">AI Strategy at Manifest</div>
              <div class="s1-divider"></div>
              <div class="s1-label" style="font-family:'Roboto',sans-serif;">Already in Flight</div>
              <div style="font-family:'Montserrat',sans-serif;font-size:13px;font-weight:400;color:var(--text-secondary);letter-spacing:0.18em;text-transform:uppercase;margin-top:0.25rem;">May 2026 &middot; Product &amp; Engineering All Hands</div>
            </div>
          </div>
        </div>
      </div>

      <!-- SLIDE 1: AGENDA -->
      <div class="slide" id="agenda">
        <div class="w-full h-full flex flex-col items-center justify-center relative overflow-hidden" id="slide-agenda">
          <div class="dots"></div>
          <div class="ag-header">
            <div class="ag-title">What We&#39;re <em>Changing</em></div>
            <div class="ag-rule"></div>
          </div>
          <div class="ag-grid-v2" id="ag-grid"></div>
        </div>
      </div>
    </div>

    <div id="slide-count"></div>
    <div id="hint">&#8592; &#8594; arrow keys to navigate</div>

    <script src="stories-index.js"></script>
    <script src="app.js"></script>
    <script>
      (function renderAgenda() {
        const grid = document.getElementById("ag-grid");
        if (!grid || !window.AH26) return;

        const config = window.AH26.loadConfig();
        const enabledIds = window.AH26.enabledInOrder(config);

        const esc = (s) =>
          String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

        const parts = [];
        let displayNum = 1;
        for (const id of enabledIds) {
          const story = window.AH26.findStory(id);
          if (!story) continue;
          const num = String(displayNum).padStart(2, "0");
          parts.push(
            `<a class="ag-link" href="${esc(story.file)}" data-topic="${esc(id)}">` +
            `<div class="ag-card">` +
            `<div class="ag-num">${num}</div>` +
            `<div class="ag-name">${esc(story.title)}</div>` +
            `<div class="ag-speaker">${esc(story.author)}</div>` +
            `</div></a>`
          );
          displayNum++;
        }
        grid.innerHTML = parts.join("");
      })();
    </script>
  </body>
</html>
